<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - ELOHIM Fast Food</title>
  <link rel="manifest" href="../manifest.json">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/js/all.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: #0a0a0a; color: #fff;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; padding: 2rem;
    }
    .login-card {
      background: #111; border: 1px solid #222; border-radius: 20px;
      padding: 2.5rem; max-width: 400px; width: 100%;
      box-shadow: 0 0 40px rgba(255,107,0,0.1);
    }
    .login-card h1 {
      font-family: 'Bebas Neue', 'Impact', sans-serif;
      font-size: 2rem; letter-spacing: 2px; color: #ff6b00;
      text-align: center; margin-bottom: 0.3rem;
    }
    .login-card p {
      text-align: center; color: #888; font-size: 0.85rem;
      margin-bottom: 1.5rem;
    }
    .form-group { margin-bottom: 1rem; }
    .form-group label {
      display: block; font-size: 0.82rem; color: #aaa;
      margin-bottom: 0.3rem; font-weight: 600;
    }
    .form-group input {
      width: 100%; padding: 0.7rem 0.9rem;
      background: #1a1a1a; border: 1px solid #333; border-radius: 10px;
      color: #fff; font-size: 0.9rem; outline: none;
      transition: border-color 0.3s;
    }
    .form-group input:focus { border-color: #ff6b00; }
    .btn {
      width: 100%; padding: 0.8rem;
      background: linear-gradient(135deg, #ff4500, #ff6b00);
      border: none; border-radius: 10px; color: #fff;
      font-size: 1rem; font-weight: 700; cursor: pointer;
      transition: transform 0.2s, box-shadow 0.3s;
    }
    .btn:hover { transform: scale(1.02); box-shadow: 0 0 20px rgba(255,107,0,0.4); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
    #errorMsg { color: #ff4500; font-size: 0.82rem; text-align: center; min-height: 1.2rem; margin-bottom: 0.5rem; }
    #successMsg { color: #4caf50; font-size: 0.82rem; text-align: center; min-height: 1.2rem; margin-bottom: 0.5rem; }
  </style>
</head>
<body>
  <div class="login-card">
    <div style="text-align:center;margin-bottom:1rem;">
      <span style="font-family:'Bebas Neue','Impact',sans-serif;font-size:2.5rem;color:#fff;letter-spacing:3px;display:inline-block;border-top:3px solid #ff6b00;border-bottom:3px solid #ff6b00;padding:0.1rem 0;">ELOHIM</span>
    </div>
    <h1>Panel Administrativo</h1>
    <p>Inicia sesión para gestionar el menú</p>
    <div id="errorMsg"></div>
    <div id="successMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" placeholder="admin@correo.com" autocomplete="username" required>
      </div>
      <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn" id="loginBtn">Iniciar Sesión</button>
    </form>
    <p style="margin-top:1rem;font-size:0.78rem;color:#555;text-align:center;">
      <i class="fas fa-shield-alt"></i> Acceso solo para administradores
    </p>
  </div>

  <script>
    const SUPABASE_URL = 'https://qxccqvdpltkirnxelctc.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InF4Y2NxdmRwbHRraXJueGVsY3RjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEyOTMzNTgsImV4cCI6MjA5Njg2OTM1OH0.pwYZjIR5GNuVk6NXRIuPFu5zFKU82qFANg0QNImrUwE';

    const loginForm = document.getElementById('loginForm');
    const email = document.getElementById('email');
    const password = document.getElementById('password');
    const errorMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const loginBtn = document.getElementById('loginBtn');

    loginForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.textContent = '';
      successMsg.textContent = '';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Ingresando...';

      try {
        const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
          method: 'POST',
          headers: {
            'apikey': SUPABASE_ANON_KEY,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            email: email.value.trim(),
            password: password.value
          })
        });

        const data = await res.json();
        console.log('Supabase response:', data);

        if (!res.ok) {
          errorMsg.textContent = data.error_description || data.message || 'Error al iniciar sesión';
          loginBtn.disabled = false;
          loginBtn.textContent = 'Iniciar Sesión';
          return;
        }

        // Store session in localStorage for dashboard to use
        localStorage.setItem('supabase.auth.token', JSON.stringify(data));
        successMsg.textContent = 'Inicio de sesión exitoso. Redirigiendo...';
        setTimeout(() => { window.location.href = 'dashboard.html'; }, 800);
      } catch (err) {
        errorMsg.textContent = 'Error de conexión: ' + err.message;
        loginBtn.disabled = false;
        loginBtn.textContent = 'Iniciar Sesión';
      }
    });
  </script>
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('../sw.js');
    }
  </script>
</body>
</html>
